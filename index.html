<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Hollow Knight SilkSong</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* Custom Embedded Dev Log Overlay */
        #embedded-debug-console {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            z-index: 10000;
            padding: 10px;
            box-sizing: border-box;
            border-top: 2px solid #444;
            display: block; /* Change to 'none' if you want it hidden by default */
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #222; }
        .log-error { color: #ff3333; }
        .log-warn { color: #ffff33; }
    </style>
</head>
<body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div id="unity-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <!-- Custom Embedded Dev Tools Output Window -->
    <div id="embedded-debug-console">
        <div class="log-entry">[System] Native Dev Tools Embed Activated. Monitoring console.log...</div>
    </div>

    <!-- jszip.js is no longer required as files are already unzipped -->
    <script>
        // --- Bypassing Console Restrictions & Injecting Debug Logs ---
        const debugConsole = document.getElementById("embedded-debug-console");
        function logToEmbed(message, type = 'info') {
            const entry = document.createElement("div");
            entry.classList.add("log-entry");
            if (type === 'error') entry.classList.add("log-error");
            if (type === 'warn') entry.classList.add("log-warn");
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugConsole.appendChild(entry);
            debugConsole.scrollTop = debugConsole.scrollHeight; // Auto-scroll
        }

        // Intercept standard browser console messages and route them to our custom overlay
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            logToEmbed(args.join(' '), 'info');
            originalLog.apply(console, args);
        };
        console.error = function(...args) {
            logToEmbed(args.join(' '), 'error');
            originalError.apply(console, args);
        };
        console.warn = function(...args) {
            logToEmbed(args.join(' '), 'warn');
            originalWarn.apply(console, args);
        };

        // Catch unhandled runtime or asset loading errors instantly
        window.onerror = function(message, source, lineno, colno, error) {
            logToEmbed(`Runtime Error: ${message} at ${source}:${lineno}`, 'error');
            return false;
        };

        // Anti-blocking shortcut: Press 'H' to toggle the log window visibility on screen
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'h') {
                debugConsole.style.display = debugConsole.style.display === 'none' ? 'block' : 'none';
            }
        });
        // -------------------------------------------------------------

        const loadingText = document.querySelector("#loading-text");
        const canvas = document.querySelector("#unity-canvas");
        const loadingBar = document.querySelector("#unity-loading-bar");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function update() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            let div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') {
                div.style = 'background:red;padding:10px;';
            } else {
                if (type == 'warning') {
                    div.style = 'background:yellow;padding:10px;';
                }
                setTimeout(() => {
                    warningBanner.removeChild(div);
                    update();
                }, 5000);
            }
            update();
        }

        const buildUrl = "Build";
        const config = {
            dataUrl: buildUrl + "/w-pt.data.unityweb",
            frameworkUrl: buildUrl + "/w-pt.framework.js.unityweb",
            codeUrl: buildUrl + "/w-pt.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "EDUrocks Group, Truffled, GN-Math",
            productName: "Hollow Knight SilkSong",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        loadingBar.style.display = "block";
        loadingText.textContent = "INITIALIZING GAME...";

        const script = document.createElement("script");
        script.src = buildUrl + "/w-pt.loader.js";
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = (progress * 100) + "%";
                loadingText.textContent = `LOADING ASSETS... (${Math.round(progress * 100)}%)`;
            })
            .then(() => {
                loadingBar.remove();
                loadingText.remove();
            })
            .catch((err) => {
                console.error(err);
                loadingText.textContent = "ERROR: " + err.message;
            });
        };
        script.onerror = () => {
            loadingText.textContent = "ERROR: Failed to load w-pt.loader.js";
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
